name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly dependency audit (see the `audit` job below). Cron is UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt · clippy · build · test
    # Push/PR/manual only. The weekly `schedule` trigger exists solely to
    # drive the `audit` job below; it must not re-run the full build+test
    # pipeline every week for no code change.
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust (stable + rustfmt + clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build release
        run: cargo build --release

      - name: Validate release executable
        shell: pwsh
        run: |
          $version = (cargo metadata --no-deps --format-version 1 |
            ConvertFrom-Json).packages[0].version
          ./scripts/check_release_binary.ps1 `
            -ExePath target/release/quickdictate.exe `
            -ExpectedVersion $version

      # Unit tests only. The live provider tests are #[ignore] — they need real
      # API keys + network and are run locally, never in CI.
      - name: Test
        run: cargo test

  audit:
    name: cargo audit (dependency vulnerabilities)
    # Weekly + on-demand only. A push/PR does not change published advisories,
    # so running this on every commit would just burn minutes for no signal.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # cargo-audit has no first-party GitHub Action; the community
      # actions-rs/audit-check action is archived/unmaintained, so install
      # the tool directly instead of depending on a dead action.
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        run: cargo audit
