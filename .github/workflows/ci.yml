name: CI

# rust-ci-speed: windows-per-change not applied: QuickDictate ships only as a Windows executable, so
# Windows is its one real platform and every leg here stays per change.

on:
  push:
    branches: [main]
    # A docs-only change cannot break the gate. No branch protection requires these checks.
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  schedule:
    # Weekly supply-chain sweep (see the `deny` job). Cron is UTC. This is the
    # one gate whose verdict changes with NO code change: a crate the lockfile
    # already pins can pick up an advisory at any time.
    - cron: "0 6 * * 1"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# The local mirror of this file is `scripts\check.ps1`. Keep them in step: a
# gate that only exists in one of the two is a gate somebody will discover the
# slow way, after a push.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A push whose exact commit already passed this workflow (a PR or dispatch run before it
  # landed) re-proves nothing. This job asks the API; if a green run exists the gates below
  # are skipped and the run reads success. The gates use `!cancelled()` so that this job
  # being skipped (PR, dispatch, schedule) or failing leaves them running: it can only ever
  # save work, never hide a gate. `deny` does not depend on it: its verdict changes with no
  # code change.
  already:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      verified: ${{ steps.check.outputs.verified }}
    steps:
      - name: Has this workflow already passed on this exact commit?
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          wf="${GITHUB_WORKFLOW_REF%%@*}"; wf="${wf##*/}"
          earlier="$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/$wf/runs?head_sha=$GITHUB_SHA&status=success&per_page=10" \
            | jq -r --arg me "$GITHUB_RUN_ID" '[.workflow_runs[] | select((.id | tostring) != $me)][0].html_url // empty')" || earlier=""
          if [ -n "$earlier" ]; then
            echo "::notice::$GITHUB_SHA already passed this workflow: $earlier. The gates are skipped."
            echo "verified=1" >> "$GITHUB_OUTPUT"
          else
            echo "no earlier green run of this workflow on $GITHUB_SHA: the gates run."
            echo "verified=0" >> "$GITHUB_OUTPUT"
          fi

  check:
    timeout-minutes: 60
    name: fmt · clippy · test
    needs: already
    # Push/PR/manual only. The weekly `schedule` trigger exists solely to drive
    # the `deny` job below; it must not re-run the full build+test pipeline
    # every week for no code change.
    if: ${{ !cancelled() && github.event_name != 'schedule' && needs.already.outputs.verified != '1' }}
    runs-on: windows-latest
    env:
      # Per-test wall times for the "30 slowest tests" step (scripts/test-timed.ps1).
      RT_TEST_TIMES: ${{ github.workspace }}\test-times.log
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # rust-toolchain.toml pins stable-x86_64-pc-windows-msvc + clippy/rustfmt,
      # which rustup installs on the first cargo invocation. Setting up a
      # toolchain here as well would silently override that pin, which is the
      # drift the pin exists to stop -- so this job deliberately has no
      # toolchain action, and prints what it resolved instead.
      - name: Toolchain
        run: rustup show

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: true

      # `mod X;` with no tracked file. This is the one class CI genuinely discovers FIRST,
      # because every local gate compiles the working tree where the untracked file still
      # exists - which is exactly how 393c38c pushed a `main` that did not compile. Running it
      # here makes the failure name the missing files instead of showing a wall of E0583s.
      - name: Every module declaration has a tracked file
        shell: pwsh
        run: ./scripts/check-untracked-mods.ps1

      - name: Format check
        run: cargo fmt --all --check

      # `clippy::unwrap_used` / `expect_used` are warned at the crate root (see
      # src/main.rs and clippy.toml) and promoted to errors here: in a
      # `windows_subsystem = "windows"` build a panicked worker thread has no
      # stderr, so an unwrap is a SILENT failure. Exceptions carry a local
      # `#[allow(..., reason = "...")]`.
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      # Unit tests only. The live provider tests are #[ignore] — they need real
      # API keys + network and are run locally, never in CI.
      #
      # This also runs the mutation-fuzz suite (`src/fuzz.rs`), which is wired
      # in as ordinary tests rather than a named job precisely so it cannot be
      # skipped: every parser that reads a network response gets thousands of
      # mutated and truncated inputs on every push, for about a second.
      - name: Test
        env:
          # The runner wraps each test binary (only those under \deps\) to add libtest's
          # --report-time; the build itself is untouched.
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUNNER: pwsh -NoProfile -File ${{ github.workspace }}\scripts\test-timed.ps1
        run: cargo test --locked --no-fail-fast

      - name: The 30 slowest tests
        if: always()
        shell: pwsh
        run: |
          if (-not (Test-Path $env:RT_TEST_TIMES)) { return }
          $rows = foreach ($line in Get-Content $env:RT_TEST_TIMES) {
            $line = $line -replace '\x1b\[[0-9;]*m', ''
            if ($line -match '^test (.*) \.\.\. ok <([0-9.]+)s>\s*$') {
              [pscustomobject]@{ Seconds = [double]$Matches[2]; Test = $Matches[1] }
            }
          }
          $rows | Sort-Object Seconds -Descending | Select-Object -First 30 |
            ForEach-Object { '{0,8:N3}s  {1}' -f $_.Seconds, $_.Test }

  # The release build reads nothing the tests build, so it runs beside `check` instead of after it: the run
  # costs the slower of the two, not their sum (7.0 min warm with both in one job, 2026-09-30). Its own cache
  # holds only release artifacts, so neither job restores and re-saves the other's profile.
  #
  # Per change it builds with thin LTO and 16 codegen units, NOT the shipped profile: the final crate compiles
  # in 111 s instead of 225-259 s with Cargo.toml's fat LTO and one codegen unit (runs 36787513157 and
  # 36788434411), and this job was the whole run's wall. The binary it checks is the same code, optimised
  # differently. The binary users get is still fat LTO: release.yml (tag-triggered) builds with Cargo.toml's
  # profile as it stands and does not read these variables, so leave it alone.
  release:
    timeout-minutes: 60
    name: release build · executable check
    needs: already
    if: ${{ !cancelled() && github.event_name != 'schedule' && needs.already.outputs.verified != '1' }}
    runs-on: windows-latest
    env:
      CARGO_PROFILE_RELEASE_LTO: thin
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Toolchain
        run: rustup show

      # Its own key: 16 codegen units rebuild every dependency, so the one-unit cache is useless here (a probe
      # without a key of its own restored it and rebuilt all 264 dependencies).
      - name: Cache cargo + release target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: thin
          cache-on-failure: true

      - name: Build release
        run: cargo build --release --locked

      - name: Validate release executable
        shell: pwsh
        run: |
          $version = (cargo metadata --no-deps --format-version 1 |
            ConvertFrom-Json).packages[0].version
          ./scripts/check_release_binary.ps1 `
            -ExePath target/release/quickdictate.exe `
            -ExpectedVersion $version

  deny:
    timeout-minutes: 60
    name: cargo-deny (advisories · licenses · sources)
    # Always: unlike every other gate, this one's verdict changes without a code
    # change, because the advisory database moves under a lockfile that did not.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: true

      # Replaces the old `cargo audit` job. cargo-audit answered only "is
      # anything in the lockfile vulnerable"; cargo-deny answers that plus
      # "may we ship this license", "did a wildcard or duplicate creep in", and
      # "did a dependency start coming from a registry or git remote nobody
      # approved" — the supply-chain question, which nothing here was asking.
      # Its config is deny.toml; the old .cargo/audit.toml is gone, so there is
      # no second ignore list to drift.
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: cargo deny check
        run: cargo deny check

  msrv:
    timeout-minutes: 60
    name: MSRV (Rust 1.95)
    needs: already
    if: ${{ !cancelled() && github.event_name != 'schedule' && needs.already.outputs.verified != '1' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: true
      # `cargo +1.95` overrides rust-toolchain.toml's `stable` pin for these
      # commands only; installing it as the default would defeat the pin for
      # everything else in the job.
      - name: Install the MSRV toolchain
        run: rustup toolchain install 1.95-x86_64-pc-windows-msvc --profile minimal
      # Keep this in step with Cargo.toml's `rust-version`. The job is what makes
      # that field a tested fact rather than a hopeful comment: without it,
      # `rust-version` drifts the moment anyone uses a newer std API.
      - name: Check on the MSRV
        run: cargo +1.95-x86_64-pc-windows-msvc check --locked --all-targets

  unused-deps:
    timeout-minutes: 60
    name: cargo-machete (unused dependencies)
    needs: already
    if: ${{ !cancelled() && github.event_name != 'schedule' && needs.already.outputs.verified != '1' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-on-failure: true
      - name: Install cargo-machete
        run: cargo install cargo-machete --locked
      # A dependency nobody uses is still compiled, still shipped, still
      # scanned for advisories, and still a supply-chain entry.
      - name: cargo machete
        run: cargo machete
