name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly dependency audit (see the `audit` job below). Cron is UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt · clippy · build · test
    # Push/PR/manual only. The weekly `schedule` trigger exists solely to
    # drive the `audit` job below; it must not re-run the full build+test
    # pipeline every week for no code change.
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Rust (stable + rustfmt + clippy)
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build release
        run: cargo build --release

      - name: Validate release executable
        shell: pwsh
        run: |
          $version = (cargo metadata --no-deps --format-version 1 |
            ConvertFrom-Json).packages[0].version
          ./scripts/check_release_binary.ps1 `
            -ExePath target/release/quickdictate.exe `
            -ExpectedVersion $version

      # Unit tests only. The live provider tests are #[ignore] — they need real
      # API keys + network and are run locally, never in CI.
      - name: Test
        run: cargo test

  audit:
    name: cargo audit (dependency vulnerabilities)
    # Weekly + on-demand always; on a pull_request only when Cargo.lock
    # actually changed (checked below), since a push/PR that doesn't touch
    # the lockfile can't change what's reachable from published advisories.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Check whether Cargo.lock changed
        id: lockfile
        shell: pwsh
        run: |
          $shouldRun = "true"
          if ("${{ github.event_name }}" -eq "pull_request") {
            $changed = git diff --name-only "origin/${{ github.base_ref }}...HEAD"
            if (-not ($changed -contains "Cargo.lock")) {
              $shouldRun = "false"
            }
          }
          "should_run=$shouldRun" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Install Rust (stable)
        if: steps.lockfile.outputs.should_run == 'true'
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      - name: Cache cargo
        if: steps.lockfile.outputs.should_run == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # cargo-audit has no first-party GitHub Action; the community
      # actions-rs/audit-check action is archived/unmaintained, so install
      # the tool directly instead of depending on a dead action.
      - name: Install cargo-audit
        if: steps.lockfile.outputs.should_run == 'true'
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        if: steps.lockfile.outputs.should_run == 'true'
        run: cargo audit
