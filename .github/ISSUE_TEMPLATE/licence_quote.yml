name: Commercial licence request
description: Using QuickDictate commercially, or building it into a paid product or service.
title: "Commercial licence request: "
labels: ["licensing"]
body:
  - type: markdown
    attributes:
      value: |
        QuickDictate is free for noncommercial use under the PolyForm Noncommercial License 1.0.0.
        Businesses can try it free of charge for up to 10 days from the day it first runs on each installation.

        Single installations are self-serve and need no issue, one license per installation: **US$19.99 once**
        for a perpetual license at https://checkout.connections.icu/licence/bf8dca80-4036-48ad-91f4-80baa1dbb9e3,
        or **US$1.99 a month** at https://checkout.connections.icu/licence/955db7f6-6561-4a30-85d7-569ea3b3ff20
        (cancel any time at https://checkout.connections.icu/manage).

        This form is for everything else: volume, purchase orders, bank transfer, and anything not covered above.
        To move a license to another PC, or to ask for a refund, email lunawerx@gmail.com.

        Only what you type here becomes public; if you would rather not post a company name, say so and we will move the conversation to email.
  - type: textarea
    id: use
    attributes:
      label: How would you use QuickDictate?
      placeholder: Where it would run, who would use it, and what it would be part of.
    validations:
      required: true
  - type: input
    id: seats
    attributes:
      label: How many installations?
    validations:
      required: true
  - type: dropdown
    id: payment
    attributes:
      label: How would you like to pay?
      options:
        - Card
        - Purchase order / invoice
        - Bank transfer
        - Not sure yet
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Anything else?
      description: Volume, timing, or anything else we should know.
    validations:
      required: false
  - type: input
    id: contact
    attributes:
      label: Where should we reply?
    validations:
      required: true
